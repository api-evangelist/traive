name: Traive
description: Traive is a Brazilian agri-fintech that connects agribusiness with financial
  investors, using AI and data analytics to simplify credit access in the agricultural
  sector. Its Traive Agro product handles agricultural credit commercialization with
  risk analysis, process automation, and financing access, while Traive Finance provides
  credit risk analysis and access to qualified agricultural assets with traceability.
  The platform serves 160K+ registered producers and manages over R$6B in structured
  recurring credit operations. Traive publishes no public developer API; its platform
  authenticates via a Keycloak OpenID Connect provider whose public discovery documents
  reveal an internal service estate (credit, farmers, retailers, ERP integration,
  GraphQL) captured in this profile.
